<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidiFlow OneClick Content Studio</title>
    <link rel="icon" type="image/png" href="/brand/vidiflow-logo.png" />
    <script>
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                     Object.getOwnPropertyDescriptor(Window.prototype, 'fetch') ||
                     (typeof globalThis !== 'undefined' && Object.getOwnPropertyDescriptor(globalThis, 'fetch'));
          
          if (!desc || !desc.writable || !desc.set) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() { return currentFetch; },
                set: function(val) { currentFetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          console.warn('Fetch setter polyfill warning:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
